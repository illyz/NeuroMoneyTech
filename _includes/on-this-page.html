{% assign contents_items = include.items | default: page.contents %}
<nav class="research-page__contents{% if include.class %} {{ include.class }}{% endif %}" aria-label="On this page">
  <span>On this page</span>
  <ul>
    {% for item in contents_items %}
      <li><a href="#{{ item.id }}"><span aria-hidden="true">›</span><span>{{ item.label }}</span></a></li>
    {% endfor %}
  </ul>
</nav>
