    - term: "Challenges in Moneywork"
      description: "Strategies, tools and technologies used by participants."
    - term: "Emotional barriers and disinterest"
      description: "Positive framing and harnessing autistic joy."
    - term: "Keeping an overview or getting lost in detail"
      description: "Financial tracking, separating and earmarking money, and adding friction."
    - term: "Cognitive and mental load"
      description: "Minimalist design, externalising information, and simplifying it."
    - term: "Maintaining consistency and regularity"
      description: "Automation, goals, lists, check-offs, and gamification."

nfl_design_tensions:
  image: "/assets/images/research/nfl-design-tensions.svg"
  width: 960
  height: 600
  featured: true
  alt: "Diagram showing five competing needs that financial technology design may need to balance. A complete text version follows below."
  caption: "Five tensions that illustrate why a single design approach cannot work for everyone."
  open_label: "Open full-size image"
  aria_label: "Open the financial technology design tensions diagram at full size"
  transcript_label: "Read this figure as text"
  transcript:
    - term: "Minimalism and aesthetics"
      description: "Reducing visual clutter can support focus, while visual stimulation can make tasks feel approachable and engaging."
    - term: "Simplification and depth"
      description: "In some cases, people want only essential information; in others, they need detail before making a decision."
    - term: "Automation and control"
      description: "Automation can make regular tasks easier, while active, close involvement can provide reassurance and control."
    - term: "Removing and adding friction"
      description: "Ease can reduce effort, while intentional barriers can help prevent unintended spending."
    - term: "Gamification and over-fixation"
      description: "Goals, lists, and progress can motivate, but can also encourage an unhealthy fixation on completing things perfectly."
