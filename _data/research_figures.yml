nfl_autism_and_moneywork:
  image: "/assets/images/research/nfl-autism-and-moneywork.svg"
  width: 960
  height: 600
  featured: true
  alt: "Diagram showing seven ways autism shaped participants' experiences of moneywork and the strategies, tools, and technologies they used. A complete text version follows below."
  caption: "How autism shaped experiences of moneywork and the approaches participants developed."
  open_label: "Open full-size image"
  aria_label: "Open the diagram about autism and moneywork at full size"
  transcript_label: "Read this figure as text"
  transcript:
    - term: "How Autism shapes experiences of moneywork"
      description: "Strategies used by Autistic people."
    - term: "Analytical skills"
      description: "using individual talents and interests."
    - term: "Attention patterns"
      description: "harnessing hyperfocus and autistic joy."
    - term: "Control and categorisation"
      description: "separating accounts and adding friction."
    - term: "Unpredictability and uncertainty"
      description: "tracking finances and planning ahead."
    - term: "Communication differences"
      description: "careful decision-making and scam awareness."
    - term: "Cognitive or sensory overload"
      description: "seeking simplicity and using automation."
    - term: "Co-occurring conditions and emotional barriers"
      description: "using positive framing and ‘spending to save’(investing in (mental) health)"

nfl_challenges_and_strategies:
  image: "/assets/images/research/nfl-challenges-and-strategies.svg"
  width: 960
