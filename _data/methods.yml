collaborative_visual_thinking:
  title: "Collaborative Visual Thinking"
  page: "/research/collaborative-visual-thinking/"
  summary: "Collaborative Visual Thinking (CVT) is a flexible interview method for exploring complex and interconnected topics with autistic adults. The participant and researcher talk while creating a shared visual artefact that helps organise ideas, make connections visible, and check their shared understanding."
  facts:
    - value: "20"
      label: "Autistic adults"
    - value: "One-to-one"
      label: "Research sessions"
    - value: "19 online, 1 in person"
      label: "Session format"
