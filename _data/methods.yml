collaborative_visual_thinking:
  title: "Collaborative Visual Thinking"
  page: "/research/collaborative-visual-thinking/"
  summary: "This method was developed to explore how autistic adults manage their personal finances. Collaborative Visual Thinking (CVT) is an interview method in which the participant and researcher have a conversation, while also creating a shared visual artefact capturing the discussion, e.g. on a (digital) whiteboard or a piece of paper. The method can support different communication preferences and help explore complex topics, relationships, and experiences."
