- id: "navigating-financial-lives"
  type: "Conference paper"
  focus: "Findings"
  title: "Navigating Financial Lives"
  authors: "Lyhme, H., Barros Pena, B., & Wilson, S."
  year: "2026"
  full_title: "Navigating Financial Lives: How Autistic Adults Adapt Financial Technologies, Tools and Strategies"
  venue: "In Proceedings of the 2026 CHI Conference on Human Factors in Computing Systems (CHI '26)"
  publisher: "Association for Computing Machinery"
  doi: "10.1145/3772318.3791131"
  abstract: >-
    Neurodiversity and autism research look at the ways in which neurological differences shape people’s lives. Money and finances touch almost all aspects of life in some way, yet there is very little research at the intersection of money and autism. This paper is the first to explore how autistic adults navigate their financial lives by using, adapting, and re-inventing financial technologies and strategies. Drawing on 20 interviews with autistic participants that included a visual mapping activity, the study identifies areas that characterise financial management activities of autistic adults, such as sensory and cognitive overload, executive functioning, and autistic joy. It further explores the technologies and strategies employed by participants and how they make these fit their needs. Using the theoretical framing of neuroqueer technoscience, the study aimed to highlight individual solutions and adaptations that the autistic participants developed, therefore treating them as knowers and makers of financial technologies. This study reveals design tensions that should be considered when creating financial technologies.

- id: "collaborative-visual-thinking"
  type: "Journal paper"
  focus: "Method"
  title: "Collaborative Visual Thinking"
  authors: "Lyhme, H., Barros Pena, B., & Wilson, S."
  year: "2026"
  full_title: "Collaborative visual thinking: a qualitative method for research with autistic adults"
  venue: "Interacting with Computers"
  venue_italic: true
  doi: "10.1093/iwc/iwag026"
  abstract: >-
    This paper introduces collaborative visual thinking (CVT) as a qualitative research method designed to engage autistic adults in research about complex and abstract topics. CVT pairs a semi-structured interview with the co-construction of a visual artefact on a collaboration canvas, such as a digital whiteboard, based on predefined guiding concepts. The method was developed for a study exploring the personal finance practices of 20 autistic adults. Framework analysis of the transcripts from the research sessions and a feedback survey showed that participants experienced CVT as autism friendly due to the overall process and the visual approach. Challenges revolved around clarity of expectations and sensory demands. CVT offers an adaptable, neurodiversity-affirming approach that invites further experimentation across contexts.
